<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Buttons · primary, ghost, link</div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <!-- Primary -->
    <button style="font-family:var(--font-ui);font-size:14px;font-weight:500;letter-spacing:0;padding:14px 22px;background:#46F3A8;color:#050707;border:none;border-radius:999px;cursor:pointer;box-shadow:0 0 40px rgba(70,243,168,0.25);">Try AI Stylist</button>
    <!-- Ghost -->
    <button style="font-family:var(--font-ui);font-size:14px;font-weight:500;padding:13px 21px;background:transparent;color:#F2EFE8;border:1px solid rgba(242,239,232,0.16);border-radius:999px;cursor:pointer;">Generate My Look</button>
    <!-- Subtle -->
    <button style="font-family:var(--font-ui);font-size:14px;font-weight:500;padding:13px 21px;background:#0E1311;color:#F2EFE8;border:1px solid rgba(242,239,232,0.08);border-radius:999px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">Watch the film</button>
    <!-- Link -->
    <a style="font-family:var(--font-ui);font-size:14px;font-weight:500;color:#F2EFE8;border-bottom:1px solid rgba(242,239,232,0.16);padding-bottom:2px;cursor:pointer;">Explore the wardrobe →</a>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:18px;">Pill radius. 13–14px label. Single accent CTA per viewport.</div>
</div></body></html>

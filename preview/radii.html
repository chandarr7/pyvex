<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Corner radii</div>
  <div style="display:flex;gap:14px;align-items:flex-end;">
    <div style="text-align:center;"><div style="width:84px;height:64px;background:#0E1311;border:1px solid var(--border);border-radius:2px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">xs</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">2px</div></div>
    <div style="text-align:center;"><div style="width:84px;height:64px;background:#0E1311;border:1px solid var(--border);border-radius:8px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">sm</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">8px</div></div>
    <div style="text-align:center;"><div style="width:84px;height:64px;background:#0E1311;border:1px solid var(--border);border-radius:12px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">md</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">12px</div></div>
    <div style="text-align:center;"><div style="width:84px;height:64px;background:#0E1311;border:1px solid var(--border);border-radius:20px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">lg</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">20px</div></div>
    <div style="text-align:center;"><div style="width:84px;height:64px;background:#0E1311;border:1px solid var(--border);border-radius:28px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">xl</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">28px</div></div>
    <div style="text-align:center;"><div style="width:84px;height:32px;background:#0E1311;border:1px solid var(--border);border-radius:999px;"></div><div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:8px;">pill</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">999</div></div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Button states</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center;">
    <div style="text-align:center;">
      <button style="font-family:var(--font-ui);font-size:13px;font-weight:500;padding:12px 20px;background:#46F3A8;color:#050707;border:none;border-radius:999px;">Begin</button>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;">rest</div>
    </div>
    <div style="text-align:center;">
      <button style="font-family:var(--font-ui);font-size:13px;font-weight:500;padding:12px 20px;background:#7AFFC2;color:#050707;border:none;border-radius:999px;box-shadow:0 0 40px rgba(70,243,168,0.45);">Begin</button>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;">hover</div>
    </div>
    <div style="text-align:center;">
      <button style="font-family:var(--font-ui);font-size:13px;font-weight:500;padding:12px 20px;background:#46F3A8;color:#050707;border:none;border-radius:999px;transform:scale(0.985);">Begin</button>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;">press · 0.985</div>
    </div>
    <div style="text-align:center;">
      <button style="font-family:var(--font-ui);font-size:13px;font-weight:500;padding:12px 20px;background:#46F3A8;color:#050707;border:none;border-radius:999px;opacity:0.3;">Begin</button>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;">disabled</div>
    </div>
  </div>
</div></body></html>

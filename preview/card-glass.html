<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Glass card · floating UI</div>
  <div style="position:relative;height:240px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#0A3A2E 0%,#15614A 45%,#46F3A8 100%);">
    <div style="position:absolute;inset:-20%;background:radial-gradient(closest-side,rgba(122,255,194,0.6),transparent 70%);filter:blur(20px);"></div>
    <div style="position:absolute;inset:0;background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><filter id=%22n%22><feTurbulence baseFrequency=%220.9%22 numOctaves=%222%22/></filter><rect width=%22120%22 height=%22120%22 filter=%22url(%23n)%22 opacity=%220.5%22/></svg>');opacity:0.18;mix-blend-mode:overlay;"></div>
    <!-- floating glass card -->
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;background:rgba(14,19,17,0.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(242,239,232,0.10);border-radius:16px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.10),0 24px 60px rgba(0,0,0,0.5);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(242,239,232,0.7);">AURA SCORE</span>
        <span style="font-family:var(--font-mono);font-size:11px;color:#46F3A8;">+12.4</span>
      </div>
      <div style="font-family:var(--font-mono);font-weight:300;font-size:48px;color:#F2EFE8;margin-top:6px;line-height:1;">94.3<span style="font-size:24px;color:rgba(242,239,232,0.5);">%</span></div>
      <div style="font-family:var(--font-ui);font-size:11px;color:rgba(242,239,232,0.6);margin-top:6px;">trend confidence · milan editorial</div>
    </div>
  </div>
</div></body></html>

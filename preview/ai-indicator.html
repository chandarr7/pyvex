<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">AI indicator · loading &amp; live</div>
  <style>
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.4);opacity:0.4;} }
    @keyframes orbit { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .dot{width:6px;height:6px;border-radius:999px;background:#46F3A8;box-shadow:0 0 12px rgba(70,243,168,0.8);}
  </style>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:center;">
    <!-- pulse -->
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div class="dot" style="animation:pulse 1.6s var(--ease) infinite;"></div>
      <span style="font-family:var(--font-ui);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#46F3A8;">LIVE</span>
    </div>
    <!-- thinking -->
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="display:flex;gap:4px;">
        <div class="dot" style="animation:pulse 1.2s var(--ease) infinite;"></div>
        <div class="dot" style="animation:pulse 1.2s var(--ease) infinite .2s;"></div>
        <div class="dot" style="animation:pulse 1.2s var(--ease) infinite .4s;"></div>
      </div>
      <span style="font-family:var(--font-ui);font-size:12px;color:var(--fg-2);">analyzing style</span>
    </div>
    <!-- orbit ring -->
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="position:relative;width:24px;height:24px;border-radius:999px;border:1px solid rgba(242,239,232,0.16);animation:orbit 1.6s linear infinite;">
        <div class="dot" style="position:absolute;top:-3px;left:50%;transform:translateX(-50%);"></div>
      </div>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-2);">94.3%</span>
    </div>
  </div>
</div></body></html>

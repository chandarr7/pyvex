<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Eyebrow labels &amp; chips</div>
  <div style="display:flex;flex-direction:column;gap:18px;">
    <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
      <span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-2);">
        <span style="width:6px;height:6px;border-radius:999px;background:#46F3A8;box-shadow:0 0 12px rgba(70,243,168,0.6);"></span>INTELLIGENCE</span>
      <span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-2);">
        <span style="width:6px;height:6px;border-radius:999px;background:#46F3A8;box-shadow:0 0 12px rgba(70,243,168,0.6);"></span>THE WARDROBE</span>
      <span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-2);">
        <span style="width:6px;height:6px;border-radius:999px;background:#46F3A8;box-shadow:0 0 12px rgba(70,243,168,0.6);"></span>FOR THE FEW</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span style="font-family:var(--font-ui);font-size:12px;padding:6px 12px;background:rgba(70,243,168,0.10);color:#46F3A8;border-radius:999px;border:1px solid rgba(70,243,168,0.30);">Editorial</span>
      <span style="font-family:var(--font-ui);font-size:12px;padding:6px 12px;background:#0E1311;color:#F2EFE8;border-radius:999px;border:1px solid rgba(242,239,232,0.08);">Streetwear</span>
      <span style="font-family:var(--font-ui);font-size:12px;padding:6px 12px;background:#0E1311;color:#F2EFE8;border-radius:999px;border:1px solid rgba(242,239,232,0.08);">Quiet luxury</span>
      <span style="font-family:var(--font-ui);font-size:12px;padding:6px 12px;background:#0E1311;color:#F2EFE8;border-radius:999px;border:1px solid rgba(242,239,232,0.08);">Tailored</span>
      <span style="font-family:var(--font-ui);font-size:12px;padding:6px 12px;background:#0E1311;color:#8B928E;border-radius:999px;border:1px solid rgba(242,239,232,0.08);">+ 12</span>
    </div>
  </div>

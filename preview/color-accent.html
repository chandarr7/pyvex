<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Aura emerald · the signature accent</div>
  <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;align-items:stretch;">
    <div style="position:relative;height:120px;background:#050707;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;inset:-20%;background:radial-gradient(closest-side,#46F3A8,transparent 70%);opacity:0.55;filter:blur(20px);"></div>
      <div style="position:relative;color:#46F3A8;font-family:var(--font-mono);font-size:18px;text-shadow:0 0 16px rgba(70,243,168,0.6);">#46F3A8</div>
    </div>
    <div>
      <div style="height:88px;background:#46F3A8;border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Aura emerald</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#46F3A8</div>
    </div>
    <div>
      <div style="height:88px;background:#7AFFC2;border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Halo</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#7AFFC2</div>
    </div>
  </div>
  <div style="margin-top:12px;font-family:var(--font-ui);font-size:11px;color:var(--fg-3);">One glow per viewport. Reserved for AI moments, primary CTA, signature dots.</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Neutrals · the obsidian field</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
    <div>
      <div style="height:88px;background:#050707;border:1px solid var(--border);border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Obsidian</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#050707</div>
    </div>
    <div>
      <div style="height:88px;background:#0E1311;border:1px solid var(--border);border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Carbon</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#0E1311</div>
    </div>
    <div>
      <div style="height:88px;background:#1A211E;border:1px solid var(--border);border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Graphite</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#1A211E</div>
    </div>
    <div>
      <div style="height:88px;background:#232B28;border:1px solid var(--border);border-radius:8px;"></div>
      <div style="font-family:var(--font-ui);font-size:12px;font-weight:500;margin-top:8px;">Slate</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">#232B28</div>
    </div>
  </div>
</div></body></html>

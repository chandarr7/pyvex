<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Jade gradient · cinematic bloom</div>
  <div style="height:180px;border-radius:16px;background:linear-gradient(135deg,#0A3A2E 0%,#15614A 45%,#46F3A8 100%);position:relative;overflow:hidden;">
    <div style="position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 30%,rgba(122,255,194,0.4),transparent 60%);"></div>
    <div style="position:absolute;left:24px;bottom:20px;font-family:var(--font-display);font-style:italic;font-weight:300;font-size:36px;color:#050707;text-shadow:0 1px 0 rgba(255,255,255,0.2);">aura</div>
  </div>
  <div style="display:flex;gap:12px;margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);">
    <span>0% #0A3A2E</span><span>·</span><span>45% #15614A</span><span>·</span><span>100% #46F3A8</span>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:18px;">Background motif · obsidian + emerald bloom + grain</div>
  <div style="position:relative;height:200px;border-radius:16px;overflow:hidden;background:#050707;">
    <!-- drifting emerald blob -->
    <div style="position:absolute;left:-10%;top:-30%;width:80%;height:140%;background:radial-gradient(closest-side,#46F3A8,transparent 65%);opacity:0.35;filter:blur(80px);"></div>
    <div style="position:absolute;right:-10%;bottom:-40%;width:60%;height:120%;background:radial-gradient(closest-side,#15614A,transparent 65%);opacity:0.55;filter:blur(80px);"></div>
    <!-- grain overlay -->
    <div style="position:absolute;inset:0;background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence baseFrequency=%220.9%22 numOctaves=%222%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22 opacity=%221%22/></svg>');opacity:0.08;mix-blend-mode:overlay;"></div>
    <!-- vignette -->
    <div style="position:absolute;inset:0;background:radial-gradient(closest-side,transparent 50%,rgba(5,7,7,0.7));"></div>
    <!-- caption -->
    <div style="position:absolute;left:24px;bottom:20px;font-family:var(--font-display);font-style:italic;font-weight:300;font-size:32px;color:#F2EFE8;letter-spacing:-0.01em;">An obsidian field.</div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:12px;">#050707 base · emerald blob (blur 80px, 35%) · 8% grain · radial vignette</div>
</div></body></html>

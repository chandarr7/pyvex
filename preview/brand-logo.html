<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:24px;">Wordmark · primary lockups</div>
  <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;align-items:stretch;">
    <!-- italic editorial -->
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="font-family:var(--font-display);font-style:italic;font-weight:400;font-size:40px;line-height:1;letter-spacing:-0.01em;">pyvex<span style="color:#46F3A8;text-shadow:0 0 12px rgba(70,243,168,0.6);">·</span>me</div>
    </div>
    <!-- uppercase serif spaced -->
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:0.4em;padding-left:0.4em;">A<span style="color:#46F3A8;">·</span>U<span style="color:#46F3A8;">·</span>R<span style="color:#46F3A8;">·</span>A</div>
    </div>
    <!-- mono badge -->
    <div style="background:#46F3A8;border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:center;">
      <div style="font-family:var(--font-display);font-style:italic;font-weight:400;font-size:36px;color:#050707;line-height:1;letter-spacing:-0.01em;">aura<span style="font-family:var(--font-mono);font-style:normal;font-size:18px;vertical-align:super;">ai</span></div>
    </div>
  </div>
</div></body></html>

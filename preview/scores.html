<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Score chips &amp; metric blocks</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
    <div style="background:#0E1311;border:1px solid rgba(242,239,232,0.08);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-3);">AURA SCORE</div>
      <div style="font-family:var(--font-mono);font-weight:300;font-size:40px;line-height:1;color:#F2EFE8;margin-top:8px;">94.3</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:#46F3A8;margin-top:4px;">↗ +12.4</div>
    </div>
    <div style="background:#0E1311;border:1px solid rgba(242,239,232,0.08);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-3);">CONFIDENCE</div>
      <div style="font-family:var(--font-mono);font-weight:300;font-size:40px;line-height:1;color:#F2EFE8;margin-top:8px;">88</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-top:4px;">· holding</div>
    </div>
    <div style="background:#0E1311;border:1px solid rgba(70,243,168,0.30);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06),0 0 32px rgba(70,243,168,0.15);">
      <div style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#46F3A8;">TREND</div>
      <div style="font-family:var(--font-mono);font-weight:300;font-size:40px;line-height:1;color:#46F3A8;margin-top:8px;">A+</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-top:4px;">milan / paris</div>
    </div>
  </div>
</div></body></html>

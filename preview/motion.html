<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Motion · the apple curve</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div style="background:#0E1311;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);">
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--accent);">cubic-bezier(0.2, 0.8, 0.2, 1)</div>
      <svg viewBox="0 0 200 80" style="width:100%;height:64px;margin-top:8px;"><path d="M 4 76 C 44 76 44 4 196 4" stroke="#46F3A8" stroke-width="1.5" fill="none"/><line x1="4" y1="76" x2="196" y2="76" stroke="#4A524E" stroke-width="0.5"/><line x1="4" y1="4" x2="4" y2="76" stroke="#4A524E" stroke-width="0.5"/></svg>
      <div style="font-family:var(--font-ui);font-size:11px;color:var(--fg-3);margin-top:6px;">Decelerated · single easing for the entire system</div>
    </div>
    <div style="display:grid;grid-template-rows:repeat(4,1fr);gap:6px;font-family:var(--font-mono);font-size:12px;">
      <div style="display:flex;justify-content:space-between;color:var(--fg-2);"><span>--dur-micro</span><span style="color:var(--fg-1);">180ms</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--fg-2);"><span>--dur-short</span><span style="color:var(--fg-1);">300ms</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--fg-2);"><span>--dur-medium</span><span style="color:var(--fg-1);">600ms</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--fg-2);"><span>--dur-long</span><span style="color:var(--fg-1);">1200ms</span></div>
    </div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:24px;">Glow system · we use glow, not shadow</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
    <div style="text-align:center;">
      <div style="width:130px;height:80px;margin:0 auto;background:#0E1311;border-radius:12px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(242,239,232,0.06);"></div>
      <div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:14px;">Inset highlight</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px;">rest state</div>
    </div>
    <div style="text-align:center;">
      <div style="width:130px;height:80px;margin:0 auto;background:#0E1311;border-radius:12px;box-shadow:0 0 0 1px rgba(70,243,168,0.20), 0 0 40px rgba(70,243,168,0.15);"></div>
      <div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:14px;">Soft glow ring</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px;">hover</div>
    </div>
    <div style="text-align:center;">
      <div style="width:130px;height:80px;margin:0 auto;background:#0E1311;border-radius:12px;box-shadow:0 0 0 1px rgba(70,243,168,0.40), 0 0 80px rgba(70,243,168,0.30);"></div>
      <div style="font-family:var(--font-ui);font-size:11px;font-weight:500;margin-top:14px;">Strong glow</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px;">focus / active</div>
    </div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px 32px;">
  <div style="font-family:var(--font-display);font-style:italic;font-size:18px;margin-bottom:22px;">Form inputs · hairline floor</div>
  <div style="display:flex;flex-direction:column;gap:14px;">
    <label style="display:block;">
      <div style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;">EMAIL</div>
      <input value="rose@maison.studio" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(242,239,232,0.16);color:#F2EFE8;font-family:var(--font-ui);font-size:16px;padding:8px 0;outline:none;box-sizing:border-box;"/>
    </label>
    <label style="display:block;">
      <div style="font-family:var(--font-ui);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;">CITY · FOCUS</div>
      <input value="Milan" style="width:100%;background:transparent;border:none;border-bottom:1.5px solid #46F3A8;color:#F2EFE8;font-family:var(--font-ui);font-size:16px;padding:8px 0;outline:none;box-sizing:border-box;box-shadow:0 6px 24px -10px rgba(70,243,168,0.45);"/>
    </label>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:14px;">Underline-only inputs. No fills. Focus = emerald hairline + soft drop glow.</div>
</div></body></html>

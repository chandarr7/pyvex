<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYVEX — Your Personal AI Stylist</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Components -->
  <script type="text/babel" src="Shared.jsx"></script>
  <script type="text/babel" src="Background.jsx"></script>
  <script type="text/babel" src="Weather.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Features.jsx"></script>
  <script type="text/babel" src="HowItWorks.jsx"></script>
  <script type="text/babel" src="SkinToneAnalyzer.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="AestheticEngine.jsx"></script>
  <script type="text/babel" src="VirtualTryOn.jsx"></script>
  <script type="text/babel" src="MobileApp.jsx"></script>
  <script type="text/babel" src="SocialProof.jsx"></script>
  <script type="text/babel" src="Pricing.jsx"></script>
  <script type="text/babel" src="FinalCTA.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const App = () => {
      // simple scroll-reveal for elements with .reveal
      React.useEffect(() => {
        const els = document.querySelectorAll('.reveal:not(.in)');
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <Background />
          <Nav />
          <main>
            <Hero />
            <WeatherStrip />
            <Features />
            <HowItWorks />
            <SkinToneAnalyzer />
            <Dashboard />
            <VirtualTryOn />
            <AestheticEngine />
            <MobileApp />
            <SocialProof />
            <Pricing />
            <FinalCTA />
          </main>
          <Footer />
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
